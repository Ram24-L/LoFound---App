name: Deploy LoFound to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, fileinfo, openssl, zip
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build Vite frontend assets
        run: |
          npm ci
          npm run build

      - name: Stage public_html payload
        run: |
          rm -rf /tmp/public_html_stage
          mkdir -p /tmp/public_html_stage
          cp -a public/. /tmp/public_html_stage/
          rm -f /tmp/public_html_stage/hot /tmp/public_html_stage/storage
          sed -i "s|__DIR__.'/../|__DIR__.'/../lofound-app/|g" /tmp/public_html_stage/index.php

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          CLEAN_HOST=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]' | sed -E 's|^https?://||; s|/.*$||; s|:[0-9]+$||')
          CLEAN_USER=$(printf '%s' "$SSH_USER" | tr -d '[:space:]')
          CLEAN_PORT=$(printf '%s' "$SSH_PORT" | tr -cd '0-9')
          CLEAN_PORT=${CLEAN_PORT:-22}

          if [ -z "$CLEAN_HOST" ] || [ -z "$CLEAN_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: SSH_HOST, SSH_USER, and SSH_PRIVATE_KEY secrets must be set."
            exit 1
          fi
          case "$CLEAN_HOST" in
            *.*) ;;
            *)
              echo "ERROR: SSH_HOST must be an IP address (e.g. 103.x.x.x) or full domain (e.g. lofound.web.id), not a single-word hostname like 'server'."
              exit 1
              ;;
          esac

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "::add-mask::$CLEAN_HOST"
          echo "::add-mask::$CLEAN_USER"
          echo "DEPLOY_HOST=$CLEAN_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$CLEAN_USER" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$CLEAN_PORT" >> "$GITHUB_ENV"

      - name: Ensure server directories exist
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'mkdir -p ~/lofound-app/storage/app/public ~/lofound-app/storage/app/private/ktp ~/lofound-app/storage/framework/cache/data ~/lofound-app/storage/framework/sessions ~/lofound-app/storage/framework/views ~/lofound-app/storage/logs ~/lofound-app/bootstrap/cache ~/public_html'

      - name: Sync Laravel app to ~/lofound-app
        run: |
          set -o pipefail
          tar -czf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./.neon' \
            --exclude='./neon.ts' \
            --exclude='./storage' \
            --exclude='./public/hot' \
            --exclude='./tests' \
            . | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'rm -rf ~/lofound-app/app ~/lofound-app/config ~/lofound-app/database ~/lofound-app/resources ~/lofound-app/routes ~/lofound-app/public/build && tar -xzf - -C ~/lofound-app'

      - name: Sync public assets to ~/public_html
        run: |
          set -o pipefail
          tar -czf - \
            --exclude='./storage' \
            --exclude='./.well-known' \
            --exclude='./cgi-bin' \
            --exclude='./error_log' \
            -C /tmp/public_html_stage . | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'rm -rf ~/public_html/build && tar -xzf - -C ~/public_html'

      - name: Run remote Laravel post-deploy tasks
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" '
            set -e
            PHP_BIN="/opt/cpanel/ea-php84/root/usr/bin/php"
            cd ~/lofound-app
            ln -sfn "$HOME/lofound-app/storage/app/public" "$HOME/public_html/storage"
            chmod -R u+rwX,go+rX storage bootstrap/cache
            if [ -f .env ]; then
              if grep -q "^APP_KEY=$" .env; then
                "$PHP_BIN" artisan key:generate --force
              fi
              "$PHP_BIN" artisan migrate --force
              "$PHP_BIN" artisan optimize
            else
              echo "WARNING: ~/lofound-app/.env not found yet. Create .env on server, then re-run this workflow or run migrate/optimize."
            fi
          '
